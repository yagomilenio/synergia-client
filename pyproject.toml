[build-system]
requires = ["setuptools>=61.0"]    
build-backend = "setuptools.build_meta"

[project]
name = "synergia"
version = "0.1.3"
description = "Distributed compute node CLI"
requires-python = ">=3.10"
dependencies = [
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "cryptography==46.0.5",
    "GPUtil==1.4.0",
    "idna==3.11",
    "markdown-it-py==4.0.0",
    "mdurl==0.1.2",
    "psutil==7.2.2",
    "pycparser==3.0",
    "Pygments==2.20.0",
    "PyJWT==2.11.0",
    "requests==2.32.5",
    "rich==14.3.3",
    "setuptools==82.0.1",
    "tabulate==0.9.0",
    "urllib3==2.6.3",
    "websockets==16.0"
]
readme = "README.md"

[project.scripts]
synergia = "client.client:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["client*", "worker*"]

[tool.setuptools.package-data]
"client" = ["config.ini.example"]
